[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# The framework is the sibling reveal-rs checkout; the kit adds nothing to it.
[workspace.dependencies]
reveal-winui = { path = "crates/reveal-winui" }
reveal-animation = { path = "../reveal-rs/crates/reveal-animation" }
reveal-cupertino = { path = "../reveal-rs/crates/reveal-cupertino" }
reveal-embedder = { path = "../reveal-rs/crates/reveal-embedder" }
reveal-embedder-winit = { path = "../reveal-rs/crates/reveal-embedder-winit" }
reveal-foundation = { path = "../reveal-rs/crates/reveal-foundation" }
reveal-gestures = { path = "../reveal-rs/crates/reveal-gestures" }
reveal-painting = { path = "../reveal-rs/crates/reveal-painting" }
reveal-rendering = { path = "../reveal-rs/crates/reveal-rendering" }
reveal-scheduler = { path = "../reveal-rs/crates/reveal-scheduler" }
reveal-services = { path = "../reveal-rs/crates/reveal-services" }
reveal-shell = { path = "../reveal-rs/crates/reveal-shell" }
reveal-widgets = { path = "../reveal-rs/crates/reveal-widgets" }
valo-harness = { path = "../valo/crates/valo-harness" }

# reveal-rs's runtime-filter support is in the sibling valo checkout until its next release;
# a patch applies per workspace root, so it is repeated here.
[patch.crates-io]
valo = { path = "../valo/crates/valo" }
valo-geometry = { path = "../valo/crates/valo-geometry" }
valo-system-fonts = { path = "../valo/crates/valo-system-fonts" }
