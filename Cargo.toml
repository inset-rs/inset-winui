[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# The framework is the sibling reveal-rs checkout; the kit adds nothing to it.
[workspace.dependencies]
inset-winui = { path = "crates/inset-winui" }
inset-animation = { path = "../reveal-rs/crates/inset-animation" }
inset-embedder = { path = "../reveal-rs/crates/inset-embedder" }
inset-embedder-winit = { path = "../reveal-rs/crates/inset-embedder-winit" }
inset-foundation = { path = "../reveal-rs/crates/inset-foundation" }
inset-gestures = { path = "../reveal-rs/crates/inset-gestures" }
inset-painting = { path = "../reveal-rs/crates/inset-painting" }
inset-rendering = { path = "../reveal-rs/crates/inset-rendering" }
inset-scheduler = { path = "../reveal-rs/crates/inset-scheduler" }
inset-services = { path = "../reveal-rs/crates/inset-services" }
inset-shell = { path = "../reveal-rs/crates/inset-shell" }
inset-widgets = { path = "../reveal-rs/crates/inset-widgets" }
valo-harness = { path = "../valo/crates/valo-harness" }

# reveal-rs's runtime-filter support is in the sibling valo checkout until its next release;
# a patch applies per workspace root, so it is repeated here.
[patch.crates-io]
valo = { path = "../valo/crates/valo" }
valo-geometry = { path = "../valo/crates/valo-geometry" }
valo-system-fonts = { path = "../valo/crates/valo-system-fonts" }
