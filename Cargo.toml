[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/inset-rs/inset-winui"
keywords = ["ui", "gui", "winui", "fluent", "inset"]
categories = ["gui"]

[workspace.lints.rust]
unsafe_code = "forbid"

# Use published Inset crates; the gallery uses the local kit under development.
[workspace.dependencies]
inset-winui = { version = "0.1.0", path = "crates/inset-winui" }
inset-animation = "0.1.0"
inset-embedder = "0.1.0"
inset-embedder-winit = "0.1.0"
inset-foundation = "0.1.0"
inset-gestures = "0.1.0"
inset-painting = "0.1.0"
inset-rendering = "0.1.0"
inset-scheduler = "0.1.0"
inset-services = "0.1.0"
inset-shell = "0.1.0"
inset-widgets = "0.1.0"
inset-winui-test-support = { path = "crates/inset-winui-test-support" }
wgpu = "30"
pollster = "0.4"
png = "0.17"
